# Render Blueprint for the STAGING API (fake data only). See docs/deployment.md.
#
# Secrets are never written here. Values marked `sync: false` are typed into
# Render's dashboard when the Blueprint is first created; SECRET_KEY is
# generated by Render. The schema owner's password (MIGRATION_DATABASE_URL)
# is deliberately NOT given to this service: migrations run from a trusted
# computer, so the running API can change rows but never the schema.

services:
  - type: web
    name: sms-api-staging
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip check
    # Render sets GUNICORN_CMD_ARGS="--preload --access-logfile - ..." for
    # Python services, which would override gunicorn.conf.py and log every
    # request's query string. `env -u` starts gunicorn without it.
    startCommand: env -u GUNICORN_CMD_ARGS gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /api/v1/health
    # Deploy a commit only after its GitHub Actions checks have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Two worker processes, so one slow request does not hold up everyone
      # (Render's default for a free instance is one). See gunicorn.conf.py.
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      # sms_app's connection string (rows only), from Neon.
      - key: DATABASE_URL
        sync: false
      # The Vercel site's address, for example https://example.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false
      # 0 until the real client IP has been checked behind Vercel and Render.
      - key: TRUSTED_PROXY_COUNT
        value: "0"
