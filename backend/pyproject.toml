[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused/undefined names), I: import order,
# B: likely bugs, UP: modern syntax, N: naming, S: security checks (Bandit rules).
select = ["E", "W", "F", "I", "B", "UP", "N", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest tests check results; tests use fake passwords as data.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
